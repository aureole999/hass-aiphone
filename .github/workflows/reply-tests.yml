name: Prerecorded reply tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components
      - run: ruff check custom_components/aiphone/config_flow.py custom_components/aiphone/camera.py custom_components/aiphone/live.py custom_components/aiphone/media.py custom_components/aiphone/media_diagnostics.py custom_components/aiphone/diagnostics.py custom_components/aiphone/coordinator.py custom_components/aiphone/reply.py custom_components/aiphone/reply_files.py tests --select E9,F
      - run: python -m pytest -q
